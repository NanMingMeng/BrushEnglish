name: 功能建议
description: 想要的新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: 你希望解决什么问题
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你设想的功能
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 其他说明
